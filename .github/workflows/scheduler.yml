# daily-report-trigger/.github/workflows/scheduler.yml
# 双市场独立触发器 — 由 cron-job.org 准时触发
# A股: 07:30 UTC (收盘 07:00 + 30min)
# 美股: 16:30 America/New_York (收盘 16:00 + 30min, DST 自动处理)

name: Daily Report Coordinator

on:
  repository_dispatch:
    types: [trigger_a_share, trigger_us_equity]

  workflow_dispatch:
    inputs:
      force:
        description: '强制运行（跳过所有去重检查）'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      reports:
        description: '发送哪些报告（逗号分隔: a_share,us_equity,monthly）'
        required: false
        default: 'a_share,us_equity'

env:
  TZ: 'UTC'

jobs:
  # ── Job 1: 去重检查（按市场隔离） ──
  dedup-check:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.decide.outputs.should_run }}
      today: ${{ steps.decide.outputs.today }}
    steps:
      - name: Get today's date
        id: date
        run: echo "TODAY=$(date -u +%Y-%m-%d)" >> $GITHUB_OUTPUT

      - name: Set cache key (market-specific for repo_dispatch)
        id: key
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "CACHE_KEY=coordinator-${{ github.event.action }}-${{ steps.date.outputs.TODAY }}" >> $GITHUB_OUTPUT
          else
            echo "CACHE_KEY=coordinator-manual-${{ steps.date.outputs.TODAY }}" >> $GITHUB_OUTPUT
          fi

      - name: Check dedup cache
        id: check
        uses: actions/cache/restore@v5
        with:
          path: .coordinator-dedup
          key: ${{ steps.key.outputs.CACHE_KEY }}

      - name: Set run decision
        id: decide
        run: |
          FORCE="${{ github.event.inputs.force }}"
          CACHE_HIT="${{ steps.check.outputs.cache-hit }}"
          TODAY="${{ steps.date.outputs.TODAY }}"

          if [ "$FORCE" = "true" ]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
            echo "✅ Force mode: will run"
          elif [ "$CACHE_HIT" = "true" ]; then
            echo "should_run=false" >> $GITHUB_OUTPUT
            echo "⏭ Already dispatched today ($TODAY), skipping"
          else
            echo "should_run=true" >> $GITHUB_OUTPUT
            echo "✅ First run today ($TODAY), will dispatch"
          fi
          echo "today=$TODAY" >> $GITHUB_OUTPUT

  # ── Job 2: 市场日检查 ──
  check-market:
    runs-on: ubuntu-latest
    needs: dedup-check
    if: always() && needs.dedup-check.outputs.should_run == 'true'
    outputs:
      is_trading_day: ${{ steps.market.outputs.is_trading_day }}
      is_month_end: ${{ steps.market.outputs.is_month_end }}
    steps:
      - name: Check market status
        id: market
        env:
          FORCE: ${{ github.event.inputs.force }}
          TRIGGER_TYPE: ${{ github.event.action }}
        run: |
          python3 << 'EOF'
          import sys, os
          from datetime import datetime, date, timedelta

          force = os.environ.get("FORCE", "false")
          trigger = os.environ.get("TRIGGER_TYPE", "")

          if force == "true":
              print("⚡ Force mode")
              os.system("echo 'is_trading_day=true' >> $GITHUB_OUTPUT")
              os.system("echo 'is_month_end=true' >> $GITHUB_OUTPUT")
              sys.exit(0)

          # A股触发 — 不需要 US 市场检查
          if trigger == "trigger_a_share":
              print("A-Share trigger: no US market check needed")
              os.system("echo 'is_trading_day=true' >> $GITHUB_OUTPUT")
              os.system("echo 'is_month_end=false' >> $GITHUB_OUTPUT")
              sys.exit(0)

          # 美股触发或手动 — 需要检查 US 交易日
          today = datetime.utcnow().date()
          weekday = today.weekday()

          if weekday >= 5:
              print("Not a trading day (weekend)")
              os.system("echo 'is_trading_day=false' >> $GITHUB_OUTPUT")
              os.system("echo 'is_month_end=false' >> $GITHUB_OUTPUT")
              sys.exit(0)

          US_HOLIDAYS_2026 = {
              date(2026, 1, 1), date(2026, 1, 19), date(2026, 2, 16),
              date(2026, 4, 3), date(2026, 5, 25), date(2026, 6, 19),
              date(2026, 7, 3), date(2026, 9, 7), date(2026, 11, 26),
              date(2026, 11, 27), date(2026, 12, 25),
          }
          US_HOLIDAYS_2027 = {
              date(2027, 1, 1), date(2027, 1, 18), date(2027, 2, 15),
              date(2027, 3, 26), date(2027, 5, 31), date(2027, 6, 18),
              date(2027, 7, 5), date(2027, 9, 6), date(2027, 11, 25),
              date(2027, 12, 24),
          }
          US_HOLIDAYS = US_HOLIDAYS_2026 | US_HOLIDAYS_2027

          is_trading = today not in US_HOLIDAYS

          is_month_end = False
          if is_trading:
              has_future_trading = False
              for i in range(1, 32):
                  future = today + timedelta(days=i)
                  if future.month != today.month:
                      break
                  if future.weekday() < 5 and future not in US_HOLIDAYS:
                      has_future_trading = True
                      break
              is_month_end = not has_future_trading

          os.system(f"echo 'is_trading_day={'true' if is_trading else 'false'}' >> $GITHUB_OUTPUT")
          os.system(f"echo 'is_month_end={'true' if is_month_end else 'false'}' >> $GITHUB_OUTPUT")
          print(f"Trading day: {is_trading}, Month end: {is_month_end}")
          EOF

  # ── Job 3: 发送 A股日报 ──
  dispatch-a-share:
    runs-on: ubuntu-latest
    needs: [dedup-check, check-market]
    if: |
      needs.check-market.outputs.is_trading_day == 'true' &&
      (github.event.action == 'trigger_a_share' || github.event_name == 'workflow_dispatch') &&
      (github.event_name != 'workflow_dispatch' || github.event.inputs.reports == '' || contains(github.event.inputs.reports, 'a_share'))
    steps:
      - name: Dispatch A-Share daily report
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.REPO_PAT }}
          script: |
            const today = '${{ needs.dedup-check.outputs.today }}';
            const force = '${{ github.event.inputs.force }}' === 'true';

            await github.rest.repos.createDispatchEvent({
              owner: context.repo.owner,
              repo: 'A-Share-report',
              event_type: 'send_report',
              client_payload: {
                date: today,
                force: force,
                source: 'coordinator'
              }
            });
            console.log(`✅ A-Share report dispatched for ${today}`);

  # ── Job 4: 发送美股日报 ──
  dispatch-us-equity:
    runs-on: ubuntu-latest
    needs: [dedup-check, check-market]
    if: |
      needs.check-market.outputs.is_trading_day == 'true' &&
      (github.event.action == 'trigger_us_equity' || github.event_name == 'workflow_dispatch') &&
      (github.event_name != 'workflow_dispatch' || github.event.inputs.reports == '' || contains(github.event.inputs.reports, 'us_equity'))
    steps:
      - name: Dispatch US Equity daily report
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.REPO_PAT }}
          script: |
            const today = '${{ needs.dedup-check.outputs.today }}';
            const force = '${{ github.event.inputs.force }}' === 'true';

            await github.rest.repos.createDispatchEvent({
              owner: context.repo.owner,
              repo: 'US-Equity-report',
              event_type: 'send_report',
              client_payload: {
                date: today,
                force: force,
                source: 'coordinator'
              }
            });
            console.log(`✅ US Equity report dispatched for ${today}`);

  # ── Job 5: 发送月报（仅月末，仅美股触发时） ──
  dispatch-monthly:
    runs-on: ubuntu-latest
    needs: [dedup-check, check-market]
    if: |
      needs.check-market.outputs.is_trading_day == 'true' &&
      needs.check-market.outputs.is_month_end == 'true' &&
      (github.event.action == 'trigger_us_equity' || github.event_name == 'workflow_dispatch') &&
      (github.event_name != 'workflow_dispatch' || github.event.inputs.reports == '' || contains(github.event.inputs.reports, 'monthly'))
    steps:
      - name: Dispatch Monthly report
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.REPO_PAT }}
          script: |
            const today = '${{ needs.dedup-check.outputs.today }}';
            const force = '${{ github.event.inputs.force }}' === 'true';

            await github.rest.repos.createDispatchEvent({
              owner: context.repo.owner,
              repo: 'monthly-full-market-report',
              event_type: 'send_report',
              client_payload: {
                date: today,
                force: force,
                source: 'coordinator',
                is_month_end: true
              }
            });
            console.log(`✅ Monthly report dispatched for ${today} (MONTH END)`);

  # ── Job 6: 写入去重缓存（按市场隔离，仅自动触发时写） ──
  mark-dispatched:
    runs-on: ubuntu-latest
    needs: [dedup-check, dispatch-a-share, dispatch-us-equity]
    if: always() && needs.dedup-check.outputs.should_run == 'true' && github.event_name == 'repository_dispatch'
    steps:
      - name: Create dedup marker
        run: |
          mkdir -p .coordinator-dedup
          echo "${{ needs.dedup-check.outputs.today }}" > .coordinator-dedup/last-dispatch.txt

      - name: Save dedup cache
        uses: actions/cache/save@v5
        with:
          path: .coordinator-dedup
          key: coordinator-${{ github.event.action }}-${{ needs.dedup-check.outputs.today }}
